<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚔</text></svg>">

  <!-- PREVENÇÃO DE CACHE -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>8ª CRF - Escala v2 Modular</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- SDK Firebase v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body class="h-full flex flex-col font-sans p-4 sm:p-6 text-slate-800">

  <div class="max-w-6xl mx-auto w-full space-y-4">
    
    <!-- Header Principal -->
    <header class="bg-white p-5 rounded-2xl shadow-sm border flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div>
        <h1 class="text-xl font-bold text-slate-900">8ª CRF - Sistema de Escalas v2</h1>
        <p class="text-xs text-slate-500">Central de Regulação de Plantões e Gestão de Equipes</p>
      </div>
      <div id="app-status">
        <span class="text-xs bg-slate-100 text-slate-600 px-3 py-1 rounded-full font-mono">Carregando...</span>
      </div>
    </header>

    <!-- Barra de Navegação por Abas -->
    <nav class="bg-white p-2 rounded-2xl shadow-sm border flex flex-wrap gap-1 border-b">
      <button id="tab-btn-crf" onclick="window.switchTab('crf')" class="tab-btn active px-4 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 bg-indigo-600 text-white shadow">
        <span>📅</span> Escala CRF / SDP
      </button>
      <button id="tab-btn-delegacia" onclick="window.switchTab('delegacia')" class="tab-btn px-4 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 text-slate-600 hover:bg-slate-100">
        <span>🏢</span> Escala por Delegacia
      </button>
      <button id="tab-btn-gestao" onclick="window.switchTab('gestao')" class="tab-btn px-4 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 text-slate-600 hover:bg-slate-100">
        <span>⚙️</span> Gestão de Escalas
      </button>
      <button id="tab-btn-unidades" onclick="window.switchTab('unidades')" class="tab-btn px-4 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 text-slate-600 hover:bg-slate-100">
        <span>🚔</span> Delegacias & Unificações
      </button>
      <button id="tab-btn-servidores" onclick="window.switchTab('servidores')" class="tab-btn px-4 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 text-slate-600 hover:bg-slate-100">
        <span>👮</span> Servidores
      </button>
    </nav>

    <!-- CONTEÚDO DAS ABAS -->

    <!-- Aba 1: Escala CRF (Grade) -->
    <main id="tab-content-crf" class="tab-content bg-white rounded-2xl shadow-sm border overflow-hidden">
      <div id="calendar-crf-container"></div>
    </main>

    <!-- Aba 2: Escala por Delegacia (Grade) -->
    <main id="tab-content-delegacia" class="tab-content hidden bg-white rounded-2xl shadow-sm border overflow-hidden">
      <div id="calendar-delegacia-container"></div>
    </main>

    <!-- Aba 3: MÓDULO DE GESTÃO DE ESCALAS -->
    <main id="tab-content-gestao" class="tab-content hidden bg-white rounded-2xl shadow-sm border overflow-hidden">
      <div id="gestao-escalas-container"></div>
    </main>

    <!-- Aba 4: Gestão de Unidades -->
    <main id="tab-content-unidades" class="tab-content hidden bg-white rounded-2xl shadow-sm border overflow-hidden">
      <div class="p-4 bg-slate-50 border-b flex items-center justify-between">
        <h2 class="font-bold text-sm text-slate-800">Delegacias e Plantões Unificados Mapeados</h2>
      </div>
      <div id="delegacias-container"></div>
    </main>

    <!-- Aba 5: Servidores -->
    <main id="tab-content-servidores" class="tab-content hidden bg-white rounded-2xl shadow-sm border overflow-hidden">
      <div class="p-4 bg-slate-50 border-b flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <h2 class="font-bold text-sm text-slate-800">Servidores Cadastrados</h2>
        <div class="flex items-center gap-2">
          <label class="cursor-pointer bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold py-2 px-3 rounded-xl transition shadow">
            <span>📥 Importar CSV</span>
            <input type="file" id="csv-file-input" accept=".csv" class="hidden">
          </label>
        </div>
      </div>
      <div id="servidores-table-container"></div>
    </main>

  </div>

  <!-- Script Principal ES6 (v2.2.2) -->
  <script type="module" src="./src/app.js?v=2.2.2"></script>
</body>
</html>
