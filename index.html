<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- PREVENÇÃO DE CACHE (Força verificação de versão atualizada) -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>8ª CRF - Escala v2 Modular</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- SDK Firebase v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body class="h-full flex flex-col font-sans p-6 text-slate-800">

  <div class="max-w-6xl mx-auto w-full space-y-6">
    <!-- Header principal -->
    <header class="bg-white p-6 rounded-2xl shadow-sm border flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div>
        <h1 class="text-xl font-bold text-slate-900">8ª CRF - Sistema de Escalas v2</h1>
        <p class="text-xs text-slate-500">Módulo de Escalas, Delegacias e Consórcios</p>
      </div>
      <div id="app-status">
        <span class="text-xs bg-slate-100 text-slate-600 px-3 py-1 rounded-full font-mono">Carregando...</span>
      </div>
    </header>

    <!-- Seção do Calendário de Escalas -->
    <section class="bg-white rounded-2xl shadow-sm border overflow-hidden">
      <div id="calendar-container">
        <!-- Renderizado dinamicamente via calendar.js -->
      </div>
    </section>

    <!-- Painel de Delegacias -->
    <section class="bg-white rounded-2xl shadow-sm border overflow-hidden">
      <div class="p-4 bg-slate-50 border-b flex items-center justify-between">
        <h2 class="font-bold text-sm text-slate-800">Unidades & Delegacias Mapeadas</h2>
      </div>
      <div id="delegacias-container">
        <!-- Renderizado via delegacias.js -->
      </div>
    </section>

    <!-- Seção de Importação CSV e Tabela de Servidores -->
    <section class="bg-white rounded-2xl shadow-sm border overflow-hidden">
      <div class="p-4 bg-slate-50 border-b flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <h2 class="font-bold text-sm text-slate-800">Servidores Cadastrados</h2>
        
        <div class="flex items-center gap-2">
          <label class="cursor-pointer bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold py-2 px-3 rounded-xl transition shadow">
            <span>📥 Importar CSV</span>
            <input type="file" id="csv-file-input" accept=".csv" class="hidden">
          </label>
        </div>
      </div>

      <!-- Tabela Renderizada -->
      <div id="servidores-table-container">
        <!-- Renderizado via servidores.js -->
      </div>
    </section>
  </div>

  <!-- Início do Módulo ES6 da v2 -->
  <script type="module" src="./src/app.js?v=2.0.5"></script>
</body>
</html>
