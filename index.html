<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚔</text></svg>">

  <!-- PREVENÇÃO RIGOROSA DE CACHE NO NAVEGADOR -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>8ª CRF - ESCALAS DE PLANTÃO | PCPR</title>
  
  <!-- FONTE OFICIAL PCPR (EXO 2) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- TAILWIND CSS COM PALETA OFICIAL PCPR INJETADA -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Exo 2"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
          colors: {
            pcpr: {
              gold: '#BEA55A',
              goldDark: '#AF9340',
              black: '#000000',
              darkGray: '#57585A',
              lightGray: '#D1D3D4',
              red: '#E2001A',
              blue: '#006AB3'
            }
          }
        }
      }
    }
  </script>

  <!-- ARQUIVO DE ESTILOS DA PASTA css/ (Versão v17.0.0) -->
  <link rel="stylesheet" href="./css/styles.css?v=17.0.0">

  <!-- SDK Firebase v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

  <script>
    const APP_BUILD_VERSION = '17.0.0';
    const VERSAO_SALVA = localStorage.getItem('escala8_build_version');

    if (VERSAO_SALVA !== APP_BUILD_VERSION) {
      console.log(`[Cache System] Nova versão detectada (${APP_BUILD_VERSION}). Limpando caches obsoletos...`);
      localStorage.removeItem('escala8_versoes_cache');
      localStorage.removeItem('escala8_dados_cache');
      localStorage.setItem('escala8_build_version', APP_BUILD_VERSION);
    }

    if (!firebase.apps.length) {
      const firebaseConfig = {
        apiKey: "AIzaSyAupeszDjCFIhxdz0AlGNgTOws1L4oC8ZE",
        authDomain: "escala8v2.firebaseapp.com",
        projectId: "escala8v2",
        storageBucket: "escala8v2.firebasestorage.app",
        messagingSenderId: "974252050712",
        appId: "1:974252050712:web:debb093dc6eea1f4c6766d"
      };
      firebase.initializeApp(firebaseConfig);

      firebase.firestore().enablePersistence({ synchronizeTabs: true }).catch((err) => {
        console.warn("Aviso ao ativar cache local do Firestore:", err.message);
      });
    }
  </script>
</head>
<body class="h-full flex flex-col font-sans p-3 sm:p-6 text-slate-800 bg-slate-100/80">

  <div class="max-w-7xl mx-auto w-full space-y-4">
    
    <!-- Header Principal -->
    <header class="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border-b-4 border-pcpr-gold border-x border-t border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <img src="./logo-pcpr.png" alt="Logo PCPR" class="h-10 sm:h-12 w-auto object-contain">
        <div>
          <h1 class="text-xl font-black tracking-tight text-slate-900 uppercase">8ª CRF - ESCALAS DE PLANTÃO</h1>
          <p class="text-xs font-semibold text-slate-500">Controle de Escalas de Plantão da CRF e das Delegacias</p>
        </div>
      </div>
      
      <div id="app-status">
        <span class="text-xs bg-slate-100 text-slate-600 px-3 py-1 rounded-full font-mono">Carregando...</span>
      </div>
    </header>

    <!-- Barra de Navegação por Abas -->
    <nav class="bg-white p-1.5 rounded-2xl shadow-sm border border-slate-200 flex flex-wrap gap-1">
      <button id="tab-btn-crf" onclick="window.switchTab('crf')" class="tab-btn active px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 cursor-pointer">
        <span>📅</span> Escala CRF
      </button>
      <button id="tab-btn-delegacia" onclick="window.switchTab('delegacia')" class="tab-btn px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 cursor-pointer">
        <span>🏢</span> Escala por Delegacia
      </button>
      <button id="tab-btn-gestao-crf" onclick="window.switchTab('gestao-crf')" class="tab-btn hidden px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 cursor-pointer">
        <span>⚙️</span> Gestão CRF
      </button>
      <button id="tab-btn-gestao-del" onclick="window.switchTab('gestao-del')" class="tab-btn hidden px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 cursor-pointer">
        <span>⚙</span> Gestão por Delegacias
      </button>
      <button id="tab-btn-feriados" onclick="window.switchTab('feriados')" class="tab-btn hidden px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 cursor-pointer">
        <span>🎉</span> Feriados
      </button>
      <button id="tab-btn-unidades" onclick="window.switchTab('unidades')" class="tab-btn hidden px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 cursor-pointer">
        <span>🚔</span> Delegacias
      </button>
      <button id="tab-btn-servidores" onclick="window.switchTab('servidores')" class="tab-btn hidden px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 cursor-pointer">
        <span>👮</span> Servidores
      </button>
      <button id="tab-btn-ferias" onclick="window.switchTab('ferias')" class="tab-btn hidden px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 cursor-pointer">
        <span>🏖️</span> Férias
      </button>
    </nav>

    <!-- CONTEÚDO DAS ABAS -->
    <main id="tab-content-crf" class="tab-content bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <div id="calendar-crf-container"></div>
    </main>

    <main id="tab-content-delegacia" class="tab-content hidden bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <div id="calendar-delegacia-container"></div>
    </main>

    <main id="tab-content-gestao-crf" class="tab-content hidden bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <div id="gestao-crf-container"></div>
    </main>

    <main id="tab-content-gestao-del" class="tab-content hidden bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <div id="gestao-delegacias-container"></div>
    </main>

    <main id="tab-content-feriados" class="tab-content hidden bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <div id="feriados-container"></div>
    </main>

    <main id="tab-content-unidades" class="tab-content hidden bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <div id="delegacias-container"></div>
    </main>

    <main id="tab-content-servidores" class="tab-content hidden bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <div id="servidores-table-container"></div>
    </main>

    <main id="tab-content-ferias" class="tab-content hidden bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <div id="ferias-container"></div>
    </main>

  </div>

  <!-- MODAL DELEGACIA (NATIVO) -->
  <div id="modalDelegacia" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full border border-slate-200 overflow-hidden animate-in fade-in zoom-in-95 duration-150">
      <div class="p-4 bg-slate-900 text-white flex justify-between items-center border-b border-slate-800">
        <h3 id="modalDelegaciaTitulo" class="font-bold text-sm">Nova Delegacia</h3>
        <button onclick="document.getElementById('modalDelegacia').classList.add('hidden')" class="text-slate-400 hover:text-white font-bold text-lg">&times;</button>
      </div>
      <form id="formDelegacia" class="p-4 space-y-3 text-xs">
        <div>
          <label class="block font-bold text-slate-700 mb-1">Nome da Delegacia / Unidade:</label>
          <input type="text" id="delNome" required placeholder="Ex: 14ª DRP GOIOERÊ" class="w-full border border-slate-300 rounded-lg p-2 font-semibold">
        </div>
        <div>
          <label class="block font-bold text-slate-700 mb-1">Subdivisão Regional (SDP):</label>
          <select id="delSubdivisao" required class="w-full border border-slate-300 rounded-lg p-2 font-semibold bg-white">
            <option value="">Selecione...</option>
          </select>
        </div>
        <div>
          <label class="block font-bold text-slate-700 mb-1">Tipo de Unidade:</label>
          <select id="delTipo" class="w-full border border-slate-300 rounded-lg p-2 font-semibold bg-white">
            <option value="UNIDADE">UNIDADE</option>
            <option value="SDP">SUBDIVISÃO (SDP)</option>
            <option value="ESPECIALIZADA">ESPECIALIZADA</option>
          </select>
        </div>
        <div class="flex items-center gap-2 pt-1">
          <input type="checkbox" id="delIsConsorcio" class="rounded text-pcpr-gold focus:ring-pcpr-gold">
          <label for="delIsConsorcio" class="font-bold text-slate-800">Plantão Unificado / Consórcio</label>
        </div>
        <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
          <button type="button" onclick="document.getElementById('modalDelegacia').classList.add('hidden')" class="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold rounded-lg">Cancelar</button>
          <button type="submit" class="px-4 py-1.5 bg-black hover:bg-slate-800 text-pcpr-gold border border-pcpr-gold font-bold rounded-lg shadow-xs">Salvar Delegacia</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL SUBDIVISÃO (NATIVO) -->
  <div id="modalSubdivisao" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full border border-slate-200 overflow-hidden animate-in fade-in zoom-in-95 duration-150">
      <div class="p-4 bg-slate-900 text-white flex justify-between items-center border-b border-slate-800">
        <h3 id="modalSubdivisaoTitulo" class="font-bold text-sm">Nova Subdivisão</h3>
        <button onclick="document.getElementById('modalSubdivisao').classList.add('hidden')" class="text-slate-400 hover:text-white font-bold text-lg">&times;</button>
      </div>
      <form id="formSubdivisao" class="p-4 space-y-3 text-xs">
        <div>
          <label class="block font-bold text-slate-700 mb-1">Nome da Subdivisão (SDP):</label>
          <input type="text" id="sdpNome" required placeholder="Ex: 7ª SDP UMUARAMA" class="w-full border border-slate-300 rounded-lg p-2 font-semibold">
        </div>
        <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
          <button type="button" onclick="document.getElementById('modalSubdivisao').classList.add('hidden')" class="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold rounded-lg">Cancelar</button>
          <button type="submit" class="px-4 py-1.5 bg-slate-800 hover:bg-black text-white font-bold rounded-lg shadow-xs">Salvar SDP</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="./src/app.js?v=17.0.0"></script>
</body>
</html>
