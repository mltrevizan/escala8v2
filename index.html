<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- PREVENÇÃO DE CACHE -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>8ª CRF - Escala v2 Modular</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- SDK Firebase v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body class="h-full flex flex-col font-sans p-4 sm:p-6 text-slate-800">

  <div class="max-w-6xl mx-auto w-full space-y-4">
    
    <!-- Header Principal -->
    <header class="bg-white p-5 rounded-2xl shadow-sm border flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div>
        <h1 class="text-xl font-bold text-slate-900">8ª CRF - Sistema de Escalas v2</h1>
        <p class="text-xs text-slate-500">Central de Regulação de Plantões e Gestão de Equipes</p>
      </div>
      <div id="app-status">
        <span class="text-xs bg-slate-100 text-slate-600 px-3 py-1 rounded-full font-mono">Carregando...</span>
      </div>
    </header>

    <!-- Barra de Navegação por Abas -->
    <nav class="bg-white p-2 rounded-2xl shadow-sm border flex flex-wrap gap-1 border-b">
      <button id="tab-btn-crf" onclick="window.switchTab('crf')" class="tab-btn active px-4 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 bg-indigo-600 text-white shadow">
        <span>📅</span> Escala CRF / SDP
      </button>
      <button id="tab-btn-delegacia" onclick="window.switchTab('delegacia')" class="tab-btn px-4 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 text-slate-600 hover:bg-slate-100">
        <span>🏢</span> Escala por Delegacia
      </button>
      <button id="tab-btn-unidades" onclick="window.switchTab('unidades')" class="tab-btn px-4 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 text-slate-600 hover:bg-slate-100">
        <span>🚔</span> Delegacias & Unificações
      </button>
      <button id="tab-btn-servidores" onclick="window.switchTab('servidores')" class="tab-btn px-4 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 text-slate-600 hover:bg-slate-100">
        <span>👮</span> Servidores
      </button>
    </nav>

    <!-- CONTEÚDO DAS ABAS -->

    <!-- Aba 1: Escala CRF (Geral / SDP) -->
    <main id="tab-content-crf" class="tab-content bg-white rounded-2xl shadow-sm border overflow-hidden">
      <div id="calendar-crf-container"></div>
    </main>

    <!-- Aba 2: Escala por Delegacia / Plantão Unificado -->
    <main id="tab-content-delegacia" class="tab-content hidden bg-white rounded-2xl shadow-sm border overflow-hidden">
      <div id="calendar-delegacia-container"></div>
    </main>

    <!-- Aba 3: Gestão de Delegacias e Plantões Unificados -->
    <main id="tab-content-unidades" class="tab-content hidden bg-white rounded-2xl shadow-sm border overflow-hidden">
      <div class="p-4 bg-slate-50 border-b flex items-center justify-between">
        <h2 class="font-bold text-sm text-slate-800">Delegacias e Plantões Unificados Mapeados</h2>
      </div>
      <div id="delegacias-container"></div>
    </main>

    <!-- Aba 4: Gestão e Importação de Servidores -->
    <main id="tab-content-servidores" class="tab-content hidden bg-white rounded-2xl shadow-sm border overflow-hidden">
      <div class="p-4 bg-slate-50 border-b flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <h2 class="font-bold text-sm text-slate-800">Servidores Cadastrados</h2>
        <div class="flex items-center gap-2">
          <label class="cursor-pointer bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold py-2 px-3 rounded-xl transition shadow">
            <span>📥 Importar CSV</span>
            <input type="file" id="csv-file-input" accept=".csv" class="hidden">
          </label>
        </div>
      </div>
      <div id="servidores-table-container"></div>
    </main>

  </div>

  <!-- MODAIS -->

  <!-- Modal Adicionar/Editar Escala -->
  <div id="modal-escala" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 space-y-4">
      <div class="flex items-center justify-between border-b pb-3">
        <h3 class="font-bold text-slate-900 text-sm">Adicionar Plantão na Escala</h3>
        <button onclick="window.fecharModalEscala()" class="text-slate-400 hover:text-slate-600 font-bold">✕</button>
      </div>

      <form onsubmit="window.salvarEscalaModal(event)" class="space-y-3 text-xs">
        <div>
          <label class="block font-bold text-slate-700 mb-1">Data:</label>
          <input type="date" id="modal-escala-data" required class="w-full border rounded-xl p-2 bg-slate-50 font-mono">
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">Tipo de Plantão:</label>
          <select id="modal-escala-tipo" required class="w-full border rounded-xl p-2 bg-slate-50 font-bold text-indigo-700">
            <!-- Preenchido dinamicamente via JS -->
          </select>
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">Servidor / Policial:</label>
          <select id="modal-escala-servidor" required class="w-full border rounded-xl p-2 bg-slate-50">
            <!-- Preenchido via JS -->
          </select>
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">Unidade / Lotação:</label>
          <select id="modal-escala-delegacia" required class="w-full border rounded-xl p-2 bg-slate-50">
            <!-- Preenchido via JS -->
          </select>
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">Turno:</label>
          <select id="modal-escala-turno" class="w-full border rounded-xl p-2 bg-slate-50 font-semibold">
            <option value="24h">24 Horas (Integral)</option>
            <option value="12h (D)">12 Horas (Diurno)</option>
            <option value="12h (N)">12 Horas (Noturno)</option>
          </select>
        </div>

        <div class="pt-3 border-t flex justify-end gap-2">
          <button type="button" onclick="window.fecharModalEscala()" class="px-4 py-2 border rounded-xl font-bold text-slate-600 hover:bg-slate-100">Cancelar</button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold shadow">Salvar Plantão</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Editar Servidor / Policial -->
  <div id="modal-servidor" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 space-y-4">
      <div class="flex items-center justify-between border-b pb-3">
        <h3 class="font-bold text-slate-900 text-sm">Editar Cadastro de Policial</h3>
        <button onclick="window.fecharModalServidor()" class="text-slate-400 hover:text-slate-600 font-bold">✕</button>
      </div>

      <form onsubmit="window.salvarServidorModal(event)" class="space-y-3 text-xs">
        <input type="hidden" id="modal-srv-id">

        <div>
          <label class="block font-bold text-slate-700 mb-1">Nome Completo:</label>
          <input type="text" id="modal-srv-nome" required class="w-full border rounded-xl p-2 bg-slate-50 font-bold">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-bold text-slate-700 mb-1">Cargo:</label>
            <input type="text" id="modal-srv-cargo" required class="w-full border rounded-xl p-2 bg-slate-50">
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">Login:</label>
            <input type="text" id="modal-srv-login" required class="w-full border rounded-xl p-2 bg-slate-50 font-mono">
          </div>
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">Telefone / Contato:</label>
          <input type="text" id="modal-srv-telefone" class="w-full border rounded-xl p-2 bg-slate-50">
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">Lotação (Delegacia):</label>
          <select id="modal-srv-delegacia" required class="w-full border rounded-xl p-2 bg-slate-50 font-medium">
            <!-- Preenchido via JS -->
          </select>
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">Nível de Acesso:</label>
          <select id="modal-srv-nivel" class="w-full border rounded-xl p-2 bg-slate-50 font-bold text-indigo-700">
            <option value="APJ">APJ / Agente</option>
            <option value="DELEGADO">DELEGADO</option>
            <option value="SUPERINTENDENTE">SUPERINTENDENTE</option>
            <option value="COORDENADOR">COORDENADOR</option>
            <option value="ADMINISTRADOR">ADMINISTRADOR</option>
          </select>
        </div>

        <div class="pt-3 border-t flex justify-end gap-2">
          <button type="button" onclick="window.fecharModalServidor()" class="px-4 py-2 border rounded-xl font-bold text-slate-600 hover:bg-slate-100">Cancelar</button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold shadow">Salvar Alterações</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Configuração de Plantão Unificado -->
  <div id="modal-unificacao" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 space-y-4">
      <div class="flex items-center justify-between border-b pb-3">
        <h3 class="font-bold text-slate-900 text-sm">Configurar Plantão Unificado</h3>
        <button onclick="window.fecharModalUnificacao()" class="text-slate-400 hover:text-slate-600 font-bold">✕</button>
      </div>

      <form onsubmit="window.salvarUnificacao(event)" class="space-y-4 text-xs">
        <input type="hidden" id="modal-unificacao-id">
        
        <div>
          <label class="block font-bold text-slate-700 mb-1">Delegacia Principal:</label>
          <input type="text" id="modal-unificacao-nome" readonly class="w-full border rounded-xl p-2 bg-slate-100 text-slate-600 font-bold">
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">Selecione as Delegacias participantes deste Plantão Unificado:</label>
          <div id="modal-unificacao-lista" class="space-y-1.5 max-h-48 overflow-y-auto border p-2 rounded-xl bg-slate-50">
            <!-- Checkboxes gerados via JS -->
          </div>
        </div>

        <div class="pt-3 border-t flex justify-end gap-2">
          <button type="button" onclick="window.fecharModalUnificacao()" class="px-4 py-2 border rounded-xl font-bold text-slate-600 hover:bg-slate-100">Cancelar</button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold shadow">Salvar Unificação</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Script principal ES6 -->
  <script type="module" src="./src/app.js?v=2.0.9"></script>
</body>
</html>
